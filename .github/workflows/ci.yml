name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Restores the pip wheel cache keyed on requirements.txt.
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke suite
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
        timeout-minutes: 8
        run: |
          mkdir -p "$XDG_DATA_HOME"
          python test.py

  # Keeps the builder image's Docker layers (the expensive pip install layer)
  # in the GitHub Actions cache. Tag runs below restore this cache because
  # GitHub exposes default-branch caches to tag refs — without this warm-up,
  # every release build would reinstall all Python dependencies from scratch.
  docker-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (populates layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          tags: safelauncher-appimage-builder:ci
          cache-from: type=gh
          cache-to: type=gh,mode=max

  release:
    # Publishing a v* tag builds the AppImage and attaches it to an
    # automatically created GitHub Release (e.g. `git tag v0.5.1 && git push origin v0.5.1`).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (pip layer restored from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          tags: safelauncher-appimage-builder:ci
          load: true
          cache-from: type=gh
          cache-to: type=gh,mode=max

      - name: Produce AppImage
        run: docker run --rm -v "$PWD/dist:/out" safelauncher-appimage-builder:ci

      - name: Attach AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SafeLauncher-x86_64.AppImage
          generate_release_notes: true
