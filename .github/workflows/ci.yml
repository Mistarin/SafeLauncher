name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Restores the pip wheel cache keyed on requirements.txt.
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke suite
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
        timeout-minutes: 8
        run: |
          mkdir -p "$XDG_DATA_HOME"
          python test.py

  # Warm the Docker layer cache (the expensive pip install layer) on master so
  # tag release builds start from it. Uses type=local + actions/cache because
  # the type=gh exporter is not supported by every buildx build.
  docker-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore builder image cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: appimage-builder-${{ hashFiles('requirements.txt') }}
          restore-keys: appimage-builder-

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (populates layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          tags: safelauncher-appimage-builder:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # actions/cache cannot update an existing key in place; rotate instead
      # so the cache directory does not grow without bound.
      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  release:
    # Publishing a v* tag builds the AppImage and attaches it to an
    # automatically created GitHub Release (e.g. `git tag v0.5.1 && git push origin v0.5.1`).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore builder image cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: appimage-builder-${{ hashFiles('requirements.txt') }}
          restore-keys: appimage-builder-

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (pip layer restored from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          tags: safelauncher-appimage-builder:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Produce AppImage
        run: docker run --rm -v "$PWD/dist:/out" safelauncher-appimage-builder:ci

      - name: Attach AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SafeLauncher-x86_64.AppImage
          generate_release_notes: true
